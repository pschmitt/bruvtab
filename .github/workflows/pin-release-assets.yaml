name: Pin Release Assets

on:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - GitHub Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to pin
        required: true
        type: string

jobs:
  pin-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pin the release asset hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          version="${WORKFLOW_DISPATCH_VERSION:-${RELEASE_VERSION:-${WORKFLOW_RUN_VERSION:-}}}"
          version="${version#refs/tags/}"

          if [[ -z "${version:-}" ]]
          then
            echo "Unable to determine release version" >&2
            exit 2
          fi

          release_json="$(gh release view "$version" --json assets)"

          digest_for() {
            local asset_name="$1" digest

            digest="$(jq -er --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest' \
              <<< "$release_json")"
            echo "${digest#sha256:}"
          }

          chromium="$(digest_for "bruvtab-chrome-${version}.crx")"
          firefox="$(digest_for "bruvtab-firefox-${version}.xpi")"

          jq --arg version "$version" --arg firefox "$firefox" --arg chromium "$chromium" \
            '.version = $version | .firefoxSha256 = $firefox | .chromiumSha256 = $chromium' \
            browser/packages/metadata.json > "$RUNNER_TEMP/metadata.json"
          cp "$RUNNER_TEMP/metadata.json" browser/packages/metadata.json

          if git diff --quiet -- browser/packages
          then
            echo "The pin for $version is already on main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: pin signed browser extension $version" -- browser/packages/metadata.json
          for attempt in 1 2 3 4 5
          do
            if git push origin HEAD:main
            then
              exit 0
            fi
            sleep $((attempt * 10))
            git pull --rebase origin main
          done
          echo "::error::main kept moving; pin $version by hand."
          exit 1
