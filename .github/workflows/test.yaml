name: test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Test extension close handling
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: node --test bruvtab/tests/test_close_tabs.js bruvtab/tests/test_force_close.js

      - name: Test with pytest
        run: |
          pytest bruvtab -s -vvv --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html --ignore bruvtab/albert --ignore bruvtab/tests/integration
  pin:
    uses: pschmitt/ci-workflows/.github/workflows/verify-pin.yaml@main
    with:
      firefox-asset: bruvtab-firefox-{version}.xpi
      chromium-asset: bruvtab-chrome-{version}.crx
      # The shipped packages differ from the source on purpose (the self-signed
      # XPI's version, the CRX's update URL): check the hashes only.
      check-payload: false
