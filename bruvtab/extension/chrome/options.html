<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BruvTab settings</title></head>
<body>
  <h1>BruvTab settings</h1>
  <h2>Close tabs with confirmation dialogs</h2>
  <p>Install the optional BruvTab force-close companion and enter its extension ID below. The companion uses debugger access to accept leave-site confirmations. Unsaved changes may be lost.</p>

  <button id="save">Save</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
