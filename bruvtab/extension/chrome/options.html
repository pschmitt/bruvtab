<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BruvTab settings</title></head>
<body>
  <h1>BruvTab settings</h1>
  <h2>Close tabs with confirmation dialogs</h2>
  <p>Allow BruvTab to use the browser debugger to accept leave-site confirmations when closing tabs. Unsaved changes may be lost. The debugger permission grants access to page data.</p>
  <button id="enable">Enable</button>
  <button id="disable">Disable</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
